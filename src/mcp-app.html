<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avanquest PDF Editor</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; overflow: hidden; }
      body { min-height: 720px; background: #fff; }
      #status {
        display: none;
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10000;
        max-width: min(560px, calc(100% - 32px));
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1e1e1e; color: #f2f2f2;
        border: 1px solid #444; border-left: 3px solid #4a9eff;
        padding: 10px 16px; border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        white-space: pre-wrap; text-align: center;
      }
      #status.status-error { border-left-color: #f87171; }

      #save-toast {
        display: none;
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10000;
        min-width: 260px; max-width: min(420px, calc(100% - 32px));
        align-items: flex-start; gap: 10px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1e1e1e; color: #f2f2f2;
        border: 1px solid #444; border-radius: 8px;
        padding: 12px 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      }
      #save-toast-icon { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
      #save-toast-body { min-width: 0; flex: 1 1 auto; }
      #save-toast-text { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
      #save-toast-path {
        display: none; margin-top: 3px; font: 11px ui-monospace, Menlo, monospace; color: #aaa;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #save-toast-progress-track { display: none; margin-top: 8px; height: 4px; border-radius: 2px; background: #3a3a3a; overflow: hidden; }
      #save-toast-progress-bar { height: 100%; width: 0%; background: #4a9eff; transition: width 0.15s ease; }

      #save-toast[data-state="progress"] #save-toast-icon {
        width: 16px; height: 16px; margin-top: 2px;
        border: 2px solid rgba(255,255,255,0.25); border-top-color: #4a9eff; border-radius: 50%;
        animation: pwv-save-toast-spin 0.8s linear infinite;
      }
      #save-toast[data-state="success"] #save-toast-icon svg { stroke: #22c55e; }
      #save-toast[data-state="error"] #save-toast-icon svg { stroke: #f87171; }
      @keyframes pwv-save-toast-spin { to { transform: rotate(360deg); } }
      #viewer { height: 720px; width: 100%; }
      /* RDB-8038: PdfEditor() briefly renders its own "no document open"
         home screen inside #viewer while mounting + loading the initial
         document -- mask it until initEditor() confirms the first document
         is ready (or failed). Below #status/#fullscreen-btn so those still
         show through it when needed. */
      #viewer-mask { position: absolute; inset: 0; background: #fff; z-index: 100; }
      #fullscreen-btn {
        display: none;
        position: fixed;
        top: 10px;
        right: 8px;
        width: 28px;
        height: 28px;
        background: rgba(40,40,40,0.85);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 5px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: background 0.15s;
      }
      #fullscreen-btn:hover { background: rgba(70,70,70,0.95); }
      #fullscreen-btn svg { width: 14px; height: 14px; fill: none; stroke: #ddd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <div id="viewer-wrap" style="position: relative;">
      <div id="viewer"></div>
      <div id="viewer-mask"></div>
    </div>
    <button id="fullscreen-btn" title="Expand"></button>
    <div id="save-toast">
      <div id="save-toast-icon"></div>
      <div id="save-toast-body">
        <div id="save-toast-text"></div>
        <div id="save-toast-path"></div>
        <div id="save-toast-progress-track"><div id="save-toast-progress-bar"></div></div>
      </div>
    </div>
    <script>
      window.PWV_CONFIG = { base: "%%PWV_BASE%%", license: "%%PWV_LICENSE%%", proxy: "%%PWV_PROXY%%" };
    </script>
    <script type="module" src="./mcp-app.ts"></script>
  </body>
</html>
